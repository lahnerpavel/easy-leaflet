stages:
  - lint
  - test

lint:php5.6:
  stage: lint
  image: php:5.6-cli
  script:
    - for f in $(find src -name "*.php"); do php -l "$f"; done

test:php7.4:
  stage: test
  image: php:7.4-cli
  before_script:
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - vendor/bin/phpunit

